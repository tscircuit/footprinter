name: Update to220 snapshots (temp)

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: Furox-Art/footprinter
          ref: fix/to220-standard-pitch

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Update snapshots
        run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/to220.test.ts

      - name: Commit snapshots
        run: |
          git config user.name "Furox-Art"
          git config user.email "177975472+Furox-Art@users.noreply.github.com"
          git add tests/__snapshots__/to220*.snap.svg
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: update to220 snapshots (ubuntu ci)"
            git push origin fix/to220-standard-pitch
          fi
