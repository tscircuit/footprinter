name: Update tqfp44 snapshots (temp)

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: Furox-Art/footprinter
          ref: fix/tqfp44-0.8mm-pitch

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Update tqfp44 snapshots
        run: BUN_UPDATE_SNAPSHOTS=1 bun test tests/tqfp.test.ts -t "tqfp44_w10"

      - name: Commit snapshots
        run: |
          git config user.name "Furox-Art"
          git config user.email "177975472+Furox-Art@users.noreply.github.com"
          git add tests/__snapshots__/tqfp44*.snap.svg
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: update tqfp44 snapshot (ubuntu ci)"
            git push origin fix/tqfp44-0.8mm-pitch
          fi
